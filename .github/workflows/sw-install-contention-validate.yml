name: Service worker install contention validate

on:
  pull_request:
    paths:
      - 'scripts/performance/measure-sw-install-contention.mjs'
      - 'scripts/performance/sw-install-contention-lib.mjs'
      - '.github/workflows/sw-install-contention-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-install-contention-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check harness
        run: |
          node --check scripts/performance/measure-sw-install-contention.mjs
          node --check scripts/performance/sw-install-contention-lib.mjs

      - name: Install fixture renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin icoutils

      - name: Build canonical catalogue data
        run: npm run catalogue

      - name: Prepare production-equivalent fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sw_contention
          mkdir -p _sw_contention/catalogue _sw_contention/explore

          cp \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _sw_contention/
          cp -R assets data _sw_contention/
          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _sw_contention/catalogue/
          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _sw_contention/explore/

          cat \
            app.js \
            assets/runtime/seek-state.js \
            assets/runtime/continuous-set-state.js \
            > _sw_contention/app.js
          grep -q 'GARBA_SEEK_STATE_RUNTIME' _sw_contention/app.js
          grep -q 'GARBA_CONTINUOUS_SET_RUNTIME' _sw_contention/app.js

          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            styles/70-mobile-playback-coordination.css \
            styles/80-genre-icon-images.css \
            > _sw_contention/styles.css
          if grep -q '@import' _sw_contention/styles.css; then
            echo 'Fixture styles must not retain CSS @import' >&2
            exit 1
          fi

          mkdir -p _sw_contention/assets/icons
          rsvg-convert -w 16 -h 16 assets/icons/icon.svg -o _sw_contention/assets/icons/favicon-16.png
          rsvg-convert -w 32 -h 32 assets/icons/icon.svg -o _sw_contention/assets/icons/favicon-32.png
          rsvg-convert -w 48 -h 48 assets/icons/icon.svg -o _sw_contention/assets/icons/favicon-48.png
          rsvg-convert -w 152 -h 152 assets/icons/icon.svg -o _sw_contention/assets/icons/apple-touch-icon-152.png
          rsvg-convert -w 167 -h 167 assets/icons/icon.svg -o _sw_contention/assets/icons/apple-touch-icon-167.png
          rsvg-convert -w 180 -h 180 assets/icons/icon.svg -o _sw_contention/assets/icons/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 assets/icons/icon.svg -o _sw_contention/assets/icons/icon-192.png
          rsvg-convert -w 512 -h 512 assets/icons/icon.svg -o _sw_contention/assets/icons/icon-512.png
          rsvg-convert -w 150 -h 150 assets/icons/icon.svg -o _sw_contention/assets/icons/mstile-150x150.png
          rsvg-convert -w 310 -h 310 assets/icons/icon.svg -o _sw_contention/assets/icons/mstile-310x310.png
          rsvg-convert -w 192 -h 192 assets/icons/maskable.svg -o _sw_contention/assets/icons/maskable-192.png
          rsvg-convert -w 512 -h 512 assets/icons/maskable.svg -o _sw_contention/assets/icons/maskable-512.png
          icotool -c -o _sw_contention/favicon.ico \
            _sw_contention/assets/icons/favicon-16.png \
            _sw_contention/assets/icons/favicon-32.png \
            _sw_contention/assets/icons/favicon-48.png

          PACK=''
          if [ -f assets/backgrounds/garba15-2048-q90.zip ]; then
            PACK='assets/backgrounds/garba15-2048-q90.zip'
          elif [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi
          test -n "$PACK" || { echo 'Required 15-image WebP pack is missing' >&2; exit 1; }
          rm -rf _sw_contention/assets/backgrounds/library
          mkdir -p _sw_contention/assets/backgrounds/library
          unzip -oq "$PACK" -d _sw_contention/assets/backgrounds/library
          test "$(find _sw_contention/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 15
          rm -f _sw_contention/assets/backgrounds/garba15-*.zip

      - name: Install temporary Playwright runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run constrained first-visit A/B
        env:
          PLAYGARBA_TESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/performance/measure-sw-install-contention.mjs
          --root=_sw_contention
          --runs=3
          --output=sw-install-contention-report.json

      - name: Summarize evidence
        if: always() && hashFiles('sw-install-contention-report.json') != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('sw-install-contention-report.json', 'utf8'));
          const allowed = report.result?.allowedSummary || {};
          const blocked = report.result?.blockedSummary || {};
          const delta = report.result?.medianDeltaAllowedMinusBlocked || {};
          console.log('## Service-worker first-visit contention A/B');
          console.log(`- Revision: \`${report.testedRevision || 'unknown'}\``);
          console.log(`- Browser: ${report.browser?.name || 'unknown'} ${report.browser?.version || ''}`);
          console.log(`- CORE_SHELL entries: ${report.fixture?.coreShellEntryCount ?? 'n/a'}`);
          console.log(`- Valid experiment: ${report.result?.valid ? 'yes' : 'no'}`);
          console.log(`- Player ready median, allowed / blocked: ${allowed.playerReadyMs?.median ?? 'n/a'} / ${blocked.playerReadyMs?.median ?? 'n/a'} ms; delta ${delta.playerReadyMs ?? 'n/a'} ms`);
          console.log(`- Catalogue ready median, allowed / blocked: ${allowed.catalogueReadyMs?.median ?? 'n/a'} / ${blocked.catalogueReadyMs?.median ?? 'n/a'} ms; delta ${delta.catalogueReadyMs ?? 'n/a'} ms`);
          console.log(`- Server requests median, allowed / blocked: ${allowed.serverRequestCount?.median ?? 'n/a'} / ${blocked.serverRequestCount?.median ?? 'n/a'}; delta ${delta.serverRequestCount ?? 'n/a'}`);
          console.log(`- Server response bytes median delta, allowed - blocked: ${delta.serverResponseBytes ?? 'n/a'}`);
          console.log('- Interpretation: the blocked scenario is an upper bound against zero service-worker install work, not a promised production-deferral benefit.');
          for (const failure of report.result?.validityFailures || []) console.log(`  - INVALID: ${failure}`);
          NODE

      - name: Upload A/B report
        if: always() && hashFiles('sw-install-contention-report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: sw-install-contention-report-${{ github.run_id }}
          path: sw-install-contention-report.json
          if-no-files-found: error
          retention-days: 14
