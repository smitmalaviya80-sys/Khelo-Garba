name: Share context policy validate

on:
  pull_request:
    paths:
      - 'src/navigation/share-context-policy.js'
      - 'scripts/lib/test-share-context-policy.mjs'
      - '.github/workflows/share-context-policy-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/navigation/share-context-policy.js'
      - 'scripts/lib/test-share-context-policy.mjs'
      - '.github/workflows/share-context-policy-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test share context policy
        run: node scripts/lib/test-share-context-policy.mjs
