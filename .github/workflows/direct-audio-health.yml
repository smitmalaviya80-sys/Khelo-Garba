name: Direct audio health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches:
      - main
    paths:
      - "data/direct-audio.json"
      - "scripts/audit-direct-host-health.mjs"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit direct-host audio delivery
        env:
          GARBA_PLAYER_ORIGIN: https://live.playgarba.com
        run: node scripts/audit-direct-host-health.mjs
