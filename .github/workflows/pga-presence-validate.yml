name: PGA presence validate

on:
  pull_request:
    paths:
      - src/pga/presence/**
      - scripts/lib/validate-pga-presence.mjs
      - .github/workflows/pga-presence-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run presence fixtures
        run: node --test src/pga/presence/tests/presence.test.mjs
      - name: Validate presence contract
        run: node scripts/lib/validate-pga-presence.mjs
