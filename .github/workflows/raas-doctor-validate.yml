name: RAAS doctor validate

on:
  pull_request:
    paths:
      - 'scripts/lib/raas-doctor.mjs'
      - 'scripts/lib/raas-doctor.test.mjs'
      - 'package.json'
      - '.github/workflows/raas-doctor-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax check RAAS doctor
        run: |
          node --check scripts/lib/raas-doctor.mjs
          node --check scripts/lib/raas-doctor.test.mjs

      - name: Run RAAS doctor state and CLI fixtures
        run: node scripts/lib/raas-doctor.test.mjs

      - name: Exercise npm doctor entry point
        shell: bash
        run: |
          set +e
          npm run --silent raas:doctor -- --issue 761 --agent ci/raas-doctor --json > /tmp/raas-doctor.json
          code=$?
          set -e
          test "$code" -eq 2
          node -e "const fs=require('fs'); const state=JSON.parse(fs.readFileSync('/tmp/raas-doctor.json','utf8')); if (state.schemaVersion !== 'raas-doctor/v1' || state.nextAction?.code !== 'REFRESH') process.exit(1);"
