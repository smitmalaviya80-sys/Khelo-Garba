name: Validate PGA Health snapshot

on:
  pull_request:
    paths:
      - 'src/pga/health/snapshot.js'
      - 'src/pga/health/tests/snapshot.test.mjs'
      - 'scripts/lib/validate-pga-health-snapshot.mjs'
      - '.github/workflows/pga-health-snapshot-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/pga/health/snapshot.js'
      - 'src/pga/health/tests/snapshot.test.mjs'
      - 'scripts/lib/validate-pga-health-snapshot.mjs'
      - '.github/workflows/pga-health-snapshot-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pga-health-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check Health snapshot module
        run: node --check src/pga/health/snapshot.js

      - name: Run all PGA Health fixtures
        run: node --test src/pga/health/tests/*.test.mjs

      - name: Validate Health snapshot purity and contract
        run: node scripts/lib/validate-pga-health-snapshot.mjs
