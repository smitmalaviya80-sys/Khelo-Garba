name: RAAS adaptive CTO v1

on:
  pull_request:
    paths:
      - '.raas/ADAPTIVE-CTO.md'
      - '.raas/adaptive-cto.json'
      - 'scripts/raas-adaptive.mjs'
      - 'scripts/raas-adaptive.test.mjs'
      - 'scripts/validate-repository-structure.mjs'
      - '.github/workflows/raas-adaptive-cto-v1.yml'

permissions:
  contents: read

jobs:
  adaptive-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check adaptive modules
        run: |
          node --check scripts/raas-adaptive.mjs
          node --check scripts/raas-adaptive.test.mjs

      - name: Run adaptive CTO regression suite
        run: node scripts/raas-adaptive.test.mjs