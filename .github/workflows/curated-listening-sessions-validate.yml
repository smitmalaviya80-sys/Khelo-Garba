name: Curated listening sessions prototype

on:
  pull_request:
    paths:
      - 'docs/product/prototypes/curated-listening-sessions.json'
      - 'docs/product/prototypes/curated-listening-sessions.html'
      - 'scripts/lib/validate-curated-listening-sessions.mjs'
      - '.github/workflows/curated-listening-sessions-validate.yml'
  push:
    branches: [main]
    paths:
      - 'docs/product/prototypes/curated-listening-sessions.json'
      - 'docs/product/prototypes/curated-listening-sessions.html'
      - 'scripts/lib/validate-curated-listening-sessions.mjs'
      - '.github/workflows/curated-listening-sessions-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curated-listening-sessions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check scripts/lib/validate-curated-listening-sessions.mjs

      - name: Validate source-truthful session prototype
        run: node scripts/lib/validate-curated-listening-sessions.mjs
