name: Validate PGA telemetry core

on:
  pull_request:
    paths:
      - 'src/pga/telemetry/**'
      - '.github/workflows/pga-telemetry-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/pga/telemetry/**'
      - '.github/workflows/pga-telemetry-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pga-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check isolated telemetry modules
        run: |
          set -euo pipefail
          for file in src/pga/telemetry/*.js; do
            node --check "$file"
          done

      - name: Run deterministic telemetry contract tests
        run: node --test src/pga/telemetry/tests/telemetry.test.mjs

      - name: Prove this lane did not integrate itself into public runtime files
        run: |
          set -euo pipefail
          ! git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD 2>/dev/null | grep -Eq '^(app\.js|simple-runtime\.js|player-continuity\.js|provider-runtime\.js|nonstop-browser\.js|sw\.js|manifest\.webmanifest|src/catalogue/|assets/runtime/explore-search\.js)'
