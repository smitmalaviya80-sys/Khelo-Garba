name: Validate PGA live presence

on:
  pull_request:
    paths:
      - 'src/pga/backend/lib/analytics.js'
      - 'src/pga/backend/tests/live-presence.test.mjs'
      - '.github/workflows/pga-live-presence-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/pga/backend/lib/analytics.js'
      - 'src/pga/backend/tests/live-presence.test.mjs'
      - '.github/workflows/pga-live-presence-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pga-live-presence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check presence query module
        run: node --check src/pga/backend/lib/analytics.js

      - name: Run PGA live-presence contract tests
        run: node --test src/pga/backend/tests/live-presence.test.mjs

      - name: Run existing PGA backend regression suite
        run: node --test src/pga/backend/tests/backend.test.mjs
