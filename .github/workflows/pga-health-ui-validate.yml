name: PGA Health UI validate

on:
  pull_request:
    paths:
      - 'src/pga/app/index.html'
      - 'src/pga/app/health.js'
      - 'src/pga/app/health.css'
      - 'scripts/lib/validate-pga-health-ui.mjs'
      - '.github/workflows/pga-health-ui-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/pga/app/index.html'
      - 'src/pga/app/health.js'
      - 'src/pga/app/health.css'
      - 'scripts/lib/validate-pga-health-ui.mjs'
      - '.github/workflows/pga-health-ui-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate PGA Health UI truth
        run: node scripts/lib/validate-pga-health-ui.mjs
