name: Validate PGA backend

on:
  pull_request:
    paths:
      - 'src/pga/backend/**'
      - '.github/workflows/pga-backend-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/pga/backend/**'
      - '.github/workflows/pga-backend-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pga-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check PGA Workers and modules
        run: |
          set -euo pipefail
          for file in src/pga/backend/*.js src/pga/backend/lib/*.js; do
            node --check "$file"
          done

      - name: Run deterministic PGA backend tests
        run: node --test src/pga/backend/tests/backend.test.mjs

      - name: Confirm no real Cloudflare identifiers were committed in examples
        run: |
          set -euo pipefail
          grep -q 'REPLACE_WITH_UNIQUE_NAMESPACE_ID' src/pga/backend/wrangler-ingest.example.toml
          grep -q 'REPLACE_WITH_D1_DATABASE_ID' src/pga/backend/wrangler-admin.example.toml
          grep -q 'REPLACE_WITH_ACCESS_APPLICATION_AUD' src/pga/backend/wrangler-admin.example.toml
          grep -q 'REPLACE_WITH_D1_DATABASE_ID' src/pga/backend/wrangler-rollup.example.toml
