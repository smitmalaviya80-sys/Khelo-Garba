name: Validate PGA admin numeric truth

on:
  pull_request:
    paths:
      - 'src/pga/backend/admin-worker.js'
      - 'src/pga/backend/tests/admin-worker-numeric-truth.test.mjs'
      - '.github/workflows/pga-admin-worker-numeric-truth-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/pga/backend/admin-worker.js'
      - 'src/pga/backend/tests/admin-worker-numeric-truth.test.mjs'
      - '.github/workflows/pga-admin-worker-numeric-truth-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pga-admin-numeric-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check PGA admin worker
        run: node --check src/pga/backend/admin-worker.js

      - name: Run PGA admin numeric truth regression tests
        run: node --test src/pga/backend/tests/admin-worker-numeric-truth.test.mjs
