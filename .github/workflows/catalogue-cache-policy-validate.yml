name: Catalogue cache policy validate

on:
  push:
    paths:
      - 'src/catalogue/catalogue-cache-policy.js'
      - 'scripts/lib/test-catalogue-cache-policy.mjs'
      - '.github/workflows/catalogue-cache-policy-validate.yml'
  pull_request:
    paths:
      - 'src/catalogue/catalogue-cache-policy.js'
      - 'scripts/lib/test-catalogue-cache-policy.mjs'
      - '.github/workflows/catalogue-cache-policy-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test catalogue cache policy
        run: node scripts/lib/test-catalogue-cache-policy.mjs
