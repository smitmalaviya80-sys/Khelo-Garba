name: Validate direct-media command planner

on:
  pull_request:
    paths:
      - 'src/playback/direct-media-command-planner.js'
      - 'scripts/lib/test-direct-media-command-planner.mjs'
      - '.github/workflows/direct-media-command-planner-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/playback/direct-media-command-planner.js'
      - 'scripts/lib/test-direct-media-command-planner.mjs'
      - '.github/workflows/direct-media-command-planner-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-media-command-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check planner
        run: node --check src/playback/direct-media-command-planner.js

      - name: Run deterministic planner fixtures
        run: node scripts/lib/test-direct-media-command-planner.mjs
