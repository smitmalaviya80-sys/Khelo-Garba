name: Validate PGA D1 numeric truth

on:
  pull_request:
    paths:
      - 'src/pga/backend/lib/d1.js'
      - 'src/pga/backend/tests/d1-numeric-truth.test.mjs'
      - '.github/workflows/pga-d1-numeric-truth-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/pga/backend/lib/d1.js'
      - 'src/pga/backend/tests/d1-numeric-truth.test.mjs'
      - '.github/workflows/pga-d1-numeric-truth-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pga-d1-numeric-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check D1 persistence module
        run: node --check src/pga/backend/lib/d1.js

      - name: Run D1 numeric truth regression tests
        run: node --test src/pga/backend/tests/d1-numeric-truth.test.mjs
