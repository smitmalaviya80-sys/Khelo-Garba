name: Playback lifecycle policy validate

on:
  pull_request:
    paths:
      - 'src/playback/playback-lifecycle-policy.js'
      - 'scripts/lib/test-playback-lifecycle-policy.mjs'
      - '.github/workflows/playback-lifecycle-policy-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/playback/playback-lifecycle-policy.js'
      - 'scripts/lib/test-playback-lifecycle-policy.mjs'
      - '.github/workflows/playback-lifecycle-policy-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check lifecycle policy syntax
        run: node --check src/playback/playback-lifecycle-policy.js
      - name: Test playback lifecycle reconciliation policy
        run: node scripts/lib/test-playback-lifecycle-policy.mjs
