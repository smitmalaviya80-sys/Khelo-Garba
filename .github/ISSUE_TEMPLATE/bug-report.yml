name: Player / website bug
description: Report a reproducible problem with GARBA's player, catalogue browser, PWA or provider playback.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the problem. Do not include private account credentials or copyrighted audio files.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Relevant GARBA URL
      description: If the bug concerns a song or genre, paste the exact deep link.
      placeholder: https://playgarba.com/?genre=...
  - type: input
    id: device
    attributes:
      label: Device / operating system
      placeholder: e.g. iPhone 14 Pro · iOS 26.6
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Safari 26, Chrome 140
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How were you using GARBA?
      options:
        - Normal browser tab
        - Installed PWA / Add to Home Screen
        - In-app browser / webview
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots / screen recording / console output
      description: Optional, but useful when it shows the problem clearly.
  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I refreshed the page once and the problem still happens.
        - label: I did not include passwords, tokens, private credentials or unlicensed audio files.
