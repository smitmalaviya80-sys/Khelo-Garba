  </style>
  <script>
    (() => {
      const path = window.location.pathname;
      const query = window.location.search;
      const hash = window.location.hash;
      if (path === '/catalogue' || path.startsWith('/catalogue/') || path === '/songs' || path.startsWith('/songs/')) {
        window.location.replace(`https://playgarba.com/explore/${query}${hash}`);
        return;
      }
      if (path === '/releases' || path.startsWith('/releases/')) {
        window.location.replace(`https://playgarba.com/explore/${query}${hash}`);
      }
    })();
  </script>

<body>
  <main>

    <h1>This page is not here.</h1>
    <p>If you were looking for music, go straight to the live player or Explore catalogue.</p>
    <div class="actions">
      <a class="primary" href="https://playgarba.com/">Open player ↗</a>
      <a class="secondary" href="/explore/">Explore catalogue →</a>

    <nav class="help" aria-label="Helpful pages">
