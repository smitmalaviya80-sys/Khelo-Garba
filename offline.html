<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15182a" />
  <meta name="color-scheme" content="dark" />
  <title>PlayGarba · Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ivory: #f6ecd7;
      --focus: #f5d77a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(32px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 30%, #28243d, #111323 65%);
      color: var(--ivory);
      text-align: center;
    }
    main { width: min(100%, 440px); }
    .brand {
      margin: 0 0 18px;
      color: rgba(246,236,215,.66);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .2em;
    }
    h1 {
      margin: 0 0 16px;
      font: 400 clamp(42px, 10vw, 68px)/1.02 Georgia, serif;
      letter-spacing: -.035em;
    }
    p {
      margin: 0 auto;
      max-width: 38ch;
      color: rgba(246,236,215,.76);
      font-size: 16px;
      line-height: 1.6;
    }
    button {
      min-width: 128px;
      min-height: 48px;
      margin-top: 26px;
      padding: 11px 20px;
      border: 1px solid rgba(246,236,215,.38);
      border-radius: 999px;
      background: rgba(17,19,35,.32);
      color: inherit;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 160ms ease, border-color 160ms ease, transform 140ms ease;
    }
    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }
    button:active { transform: scale(.97); }
    @media (hover: hover) and (pointer: fine) {
      button:hover {
        border-color: rgba(246,236,215,.64);
        background: rgba(246,236,215,.08);
      }
    }
    @media (prefers-contrast: more) {
      p { color: var(--ivory); }
      button { border-color: var(--ivory); }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">PLAYGARBA</p>
    <h1>You’re offline.</h1>
    <p>PlayGarba’s interface can be available from cache, but music playback uses YouTube and needs an internet connection. Reconnect, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
